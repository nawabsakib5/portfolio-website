<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ profile.name }} - Portfolio{% endblock %}</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --bg-alt: #111118;
            --accent: #7dd3fc;
            --accent2: #a78bfa;
            --text: #f1f5f9;
            --text-dim: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            overflow-x: hidden;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 32px;
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            padding: 22px 0;
            background: rgba(10, 10, 15, 0.7);
            backdrop-filter: blur(12px);
            transition: background 0.3s;
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 1px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .nav-links a {
            color: var(--text-dim);
            text-decoration: none;
            margin-left: 32px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            position: relative;
            padding-bottom: 4px;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 0; height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            transition: width 0.3s;
        }

        .nav-links a:hover { color: var(--text); }
        .nav-links a:hover::after { width: 100%; }

        /* Hero */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            background:
                radial-gradient(circle at 20% 20%, rgba(125,211,252,0.15), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(167,139,250,0.15), transparent 40%),
                var(--bg);
            padding: 100px 0 60px;
        }

        .profile-photo {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 28px;
            border: 3px solid transparent;
            background: linear-gradient(var(--bg), var(--bg)) padding-box,
                        linear-gradient(135deg, var(--accent), var(--accent2)) border-box;
            box-shadow: 0 0 60px rgba(125,211,252,0.25);
        }

        .hero .eyebrow {
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 18px;
            font-weight: 700;
        }

        .hero h1 {
            font-size: clamp(2.4rem, 6vw, 4.2rem);
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.1;
            margin-bottom: 14px;
        }

        .hero h3 {
            font-weight: 500;
            font-size: 1.3rem;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 22px;
        }

        .bio {
            max-width: 600px;
            margin: 0 auto 32px;
            color: var(--text-dim);
            font-size: 1.05rem;
        }

        .social-links a {
            display: inline-block;
            color: var(--text);
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 10px 24px;
            border-radius: 30px;
            margin: 0 6px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .social-links a:hover {
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            color: #0a0a0f;
            border-color: transparent;
            transform: translateY(-3px);
        }

        .scroll-cue {
            position: absolute;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--text-dim);
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translate(-50%, 0); }
            50% { transform: translate(-50%, 8px); }
        }

        /* Sections */
        .section { padding: 110px 0; }
        .alt-bg { background: var(--bg-alt); }

        .section-tag {
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 10px;
            display: block;
        }

        .section-title {
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            font-weight: 800;
            margin-bottom: 50px;
            letter-spacing: -0.5px;
        }

        /* Timeline */
        .timeline-item {
            position: relative;
            padding-left: 32px;
            margin-bottom: 36px;
            border-left: 2px solid rgba(255,255,255,0.1);
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -7px;
            top: 4px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            box-shadow: 0 0 12px rgba(125,211,252,0.6);
        }

        .timeline-item h3 { font-size: 1.15rem; margin-bottom: 4px; }

        .timeline-item .org {
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .timeline-item p { color: var(--text-dim); font-size: 0.95rem; }

        .timeline-item a {
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
        }

        .timeline-item a:hover { text-decoration: underline; }

        .subhead {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 50px 0 30px;
            color: var(--text);
        }

        /* Project grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 28px;
        }

        .card {
            background: var(--bg);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            overflow: hidden;
            transition: transform 0.35s, border-color 0.35s;
            position: relative;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
        }

        .card-img-wrap { overflow: hidden; height: 190px; }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .card:hover .card-img { transform: scale(1.08); }

        .card-body { padding: 24px; }

        .card-body h3 { font-size: 1.15rem; margin-bottom: 10px; }
        .card-body p { color: var(--text-dim); font-size: 0.92rem; margin-bottom: 12px; }

        .tech-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }

        .tech-tag {
            font-size: 0.72rem;
            background: rgba(125,211,252,0.1);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .card-links a {
            margin-right: 18px;
            color: var(--text);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--accent);
            padding-bottom: 2px;
        }

        .card-links a:hover { color: var(--accent); }

        /* Skills */
        .skills-list { display: flex; flex-wrap: wrap; gap: 12px; }

        .skill-badge {
            background: var(--bg);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .skill-badge:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-3px);
        }

        /* Contact */
        .contact-box {
            text-align: center;
            padding: 60px 40px;
            border-radius: 20px;
            background: radial-gradient(circle at 50% 0%, rgba(125,211,252,0.1), transparent 60%);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .contact-box a.email-link {
            display: inline-block;
            margin-top: 20px;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text);
            text-decoration: none;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 4px;
        }

        .contact-box a.email-link:hover { color: var(--accent); }

        /* Footer */
        .footer {
            padding: 30px 0;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.85rem;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        /* Fade-in animation */
        .fade-section {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .fade-section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 640px) {
            .nav-links a { margin-left: 16px; font-size: 0.72rem; }
            .section { padding: 70px 0; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container nav-content">
            <span class="logo">{{ profile.name }}</span>
            <div class="nav-links">
                <a href="#about">About</a>
                <a href="#experience">Experience</a>
                <a href="#projects">Work</a>
                <a href="#skills">Skills</a>
                <a href="#contact">Contact</a>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <footer class="footer">
        <div class="container">
            <p>&copy; {% now "Y" %} {{ profile.name }} — Built with Django</p>
        </div>
    </footer>

    <script>
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) target.scrollIntoView({ behavior: 'smooth' });
            });
        });

        const fadeEls = document.querySelectorAll('.fade-section');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.12 });
        fadeEls.forEach(el => observer.observe(el));
    </script>

</body>
</html>
