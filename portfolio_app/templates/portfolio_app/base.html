<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ profile.name }}{% endblock %}</title>

    <!-- Devicon CDN (SVG/Vector Tech Icons) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">

    <style>
        :root {
            --bg: #050508;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.08);
            --accent: #7dd3fc;
            --accent2: #a78bfa;
            --accent3: #34d399;
            --text: #f1f5f9;
            --text-dim: #64748b;
            --text-mid: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            overflow-x: hidden;
        }

        /* Ambient orbs */
        body::before {
            content: '';
            position: fixed;
            top: -30vh; left: -20vw;
            width: 80vw; height: 80vh;
            background: radial-gradient(circle, rgba(125,211,252,0.07) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -30vh; right: -20vw;
            width: 80vw; height: 80vh;
            background: radial-gradient(circle, rgba(167,139,250,0.07) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 32px;
            position: relative;
            z-index: 1;
            width: 100%;
        }

        /* ── NAVBAR ── */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 999;
            padding: 18px 0;
            background: rgba(5, 5, 8, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            transition: background 0.3s;
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 1px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .nav-links a {
            color: var(--text-mid);
            text-decoration: none;
            margin-left: 32px;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            transition: color 0.3s;
            position: relative;
            padding-bottom: 4px;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 0; height: 1px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            transition: width 0.3s;
        }

        .nav-links a:hover { color: var(--text); }
        .nav-links a:hover::after { width: 100%; }

        /* ── HERO (FULLY CENTERED LAYOUT) ── */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 0 80px;
            position: relative;
            text-align: center;
            background: radial-gradient(circle at center, rgba(5,5,8,0.75) 0%, rgba(5,5,8,0.92) 80%), 
                        url('{% if profile.photo %}{{ profile.photo.url }}{% endif %}') center center / cover no-repeat;
        }

        .hero-inner { 
            position: relative; 
            z-index: 1; 
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .eyebrow {
            display: inline-block;
            font-size: 0.72rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 18px;
            padding: 6px 20px;
            background: rgba(125,211,252,0.07);
            border: 1px solid rgba(125,211,252,0.15);
            border-radius: 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.05;
            margin-bottom: 16px;
            text-align: center;
            width: 100%;
        }

        .hero h3 {
            font-size: 1.2rem;
            font-weight: 400;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 24px;
            text-align: center;
        }

        .bio {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 32px auto;
            color: var(--text-mid);
            font-size: 1rem;
            text-align: center;
        }

        .social-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            width: 100%;
        }

        .social-links a {
            color: var(--text-mid);
            text-decoration: none;
            padding: 8px 22px;
            border-radius: 30px;
            font-size: 0.82rem;
            font-weight: 600;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }

        .social-links a:hover {
            background: rgba(125,211,252,0.1);
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-3px);
        }

        /* CV & Action Buttons Centered */
        .cv-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            width: 100%;
        }

        .cv-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #050508;
        }

        .cv-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(125,211,252,0.3);
        }

        .cv-btn-outline {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text);
            backdrop-filter: blur(10px);
        }

        .cv-btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 12px 30px rgba(125,211,252,0.1);
        }

        .scroll-cue {
            position: absolute;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--text-dim);
            font-size: 0.68rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: bounce 2.5s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translate(-50%, 0); opacity: 0.5; }
            50% { transform: translate(-50%, 8px); opacity: 1; }
        }

        /* ── SECTIONS ── */
        .section { padding: 120px 0; position: relative; z-index: 1; }

        .section-tag {
            display: inline-block;
            font-size: 0.7rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 56px;
            line-height: 1.1;
        }

        .subhead {
            font-size: 0.8rem;
            font-weight: 700;
            margin: 56px 0 28px;
            color: var(--text-mid);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* ── TIMELINE ── */
        .timeline-item {
            position: relative;
            padding: 24px 28px;
            margin-bottom: 16px;
            border-radius: 16px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            transition: border-color 0.3s, transform 0.3s;
        }

        .timeline-item:hover {
            border-color: rgba(125,211,252,0.2);
            transform: translateX(6px);
        }

        .timeline-item h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; }

        .timeline-item .org {
            color: var(--accent);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .timeline-item p { color: var(--text-mid); font-size: 0.93rem; }

        .timeline-item a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            color: var(--accent);
            font-size: 0.82rem;
            font-weight: 700;
            text-decoration: none;
            border-bottom: 1px solid rgba(125,211,252,0.3);
            padding-bottom: 2px;
        }

        /* ── PROJECT GRID ── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
        }

        .card {
            border-radius: 20px;
            overflow: hidden;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            transition: transform 0.4s, border-color 0.4s;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: rgba(125,211,252,0.25);
        }

        .card-img-wrap { overflow: hidden; height: 200px; position: relative; }

        .card-img-wrap::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(5,5,8,0.8), transparent 60%);
        }

        .card-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
        .card:hover .card-img { transform: scale(1.08); }

        .card-body { padding: 24px; }
        .card-body h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 10px; }
        .card-body p { color: var(--text-mid); font-size: 0.9rem; margin-bottom: 14px; }

        .tech-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }

        .tech-tag {
            font-size: 0.7rem;
            background: rgba(125,211,252,0.08);
            border: 1px solid rgba(125,211,252,0.15);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .card-links { display: flex; gap: 14px; }

        .card-links a {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-mid);
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            transition: all 0.3s;
        }

        .card-links a:hover { color: var(--accent); border-color: var(--accent); }

        /* ── SKILLS ── */
        .skills-list { display: flex; flex-wrap: wrap; gap: 12px; }

        .skill-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 0.88rem;
            font-weight: 600;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            cursor: default;
            transition: all 0.3s;
        }

        .skill-badge i {
            font-size: 1.3rem;
            line-height: 1;
        }

        .skill-badge:hover {
            background: rgba(125,211,252,0.08);
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-3px);
        }

        /* ── CERTIFICATE CARDS ── */
        .cert-grid { display: flex; flex-direction: column; gap: 14px; }

        .cert-card {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 20px 24px;
            border-radius: 16px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            transition: all 0.3s;
        }

        .cert-card:hover {
            border-color: rgba(125,211,252,0.2);
            transform: translateX(6px);
        }

        .cert-icon {
            font-size: 1.6rem;
            flex-shrink: 0;
            width: 52px; height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(125,211,252,0.08);
            border: 1px solid rgba(125,211,252,0.15);
            border-radius: 12px;
        }

        .cert-info { flex: 1; }
        .cert-info h3 { font-size: 0.95rem; font-weight: 700; margin-bottom: 4px; }
        .cert-info .org {
            color: var(--text-dim);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cert-actions { display: flex; gap: 8px; flex-shrink: 0; }

        .cert-actions a {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
            border: 1px solid rgba(125,211,252,0.25);
            padding: 6px 14px;
            border-radius: 20px;
            transition: all 0.3s;
        }

        .cert-actions a:hover { background: var(--accent); color: #050508; }

        /* ── CONTACT ── */
        .contact-box {
            text-align: center;
            padding: 80px 40px;
            border-radius: 24px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
        }

        .contact-box::before {
            content: '';
            position: absolute;
            top: -50%; left: 50%;
            transform: translateX(-50%);
            width: 400px; height: 300px;
            background: radial-gradient(circle, rgba(125,211,252,0.08), transparent 70%);
            pointer-events: none;
        }

        .contact-box .section-title { margin-bottom: 6px; }

        .contact-sub {
            color: var(--text-mid);
            font-size: 0.95rem;
            margin-bottom: 0;
        }

        .contact-links {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 500px;
            margin: 36px auto 0;
        }

        .contact-card {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 18px 22px;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text);
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.09);
            backdrop-filter: blur(16px);
            transition: all 0.35s;
            position: relative;
            overflow: hidden;
        }

        .contact-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(125,211,252,0.05), transparent);
            opacity: 0;
            transition: opacity 0.35s;
        }

        .contact-card:hover::before { opacity: 1; }

        .contact-card:hover {
            border-color: rgba(125,211,252,0.3);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .contact-logo {
            width: 52px; height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .gmail-logo {
            background: rgba(234,67,53,0.12);
            border: 1px solid rgba(234,67,53,0.25);
        }

        .linkedin-logo {
            background: rgba(0,119,181,0.12);
            border: 1px solid rgba(0,119,181,0.25);
        }

        .contact-card-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
            text-align: left;
        }

        .contact-card-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            font-weight: 600;
        }

        .contact-card-value {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text);
        }

        .contact-arrow {
            font-size: 1.1rem;
            color: var(--text-dim);
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .contact-card:hover .contact-arrow {
            color: var(--accent);
            transform: translateX(5px);
        }

        /* ── DIVIDER ── */
        .glass-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--glass-border), transparent);
        }

        /* ── FOOTER ── */
        .footer {
            padding: 28px 0;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.78rem;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }

        /* ── ANIMATIONS ── */
        .fade-section {
            opacity: 0;
            transform: translateY(32px);
            transition: opacity 0.9s ease, transform 0.9s ease;
        }

        .fade-section.visible { opacity: 1; transform: translateY(0); }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            .nav-links a { margin-left: 16px; font-size: 0.68rem; letter-spacing: 1px; }
            .section { padding: 80px 0; }
            .hero h1 { letter-spacing: -1px; }
            .cert-card { flex-wrap: wrap; }
            .cert-actions { width: 100%; }
            .contact-card-value { font-size: 0.82rem; }
            .contact-box { padding: 50px 24px; }
            .grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 480px) {
            .container { padding: 0 20px; }
            .nav-links a { margin-left: 10px; font-size: 0.6rem; }
            .cv-buttons { flex-direction: column; align-items: stretch; }
            .social-links { gap: 8px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container nav-content">
            <span class="logo">{{ profile.name }}</span>
            <div class="nav-links">
                <a href="#about">About</a>
                <a href="#experience">Experience</a>
                <a href="#projects">Projects</a>
                <a href="#skills">Skills</a>
                <a href="#contact">Contact</a>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <div class="glass-divider"></div>

    <footer class="footer">
        <div class="container">
            <p>{% now "Y" %} &copy; {{ profile.name }}</p>
        </div>
    </footer>

    <script>
        // Smooth scroll
        document.querySelectorAll('a[href^="#"]').forEach(link => {
            link.addEventListener('click', function(e) {
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    e.preventDefault();
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });

        // Fade-in on scroll
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.fade-section').forEach(el => observer.observe(el));

        // Navbar scroll opacity
        window.addEventListener('scroll', () => {
            const nav = document.querySelector('.navbar');
            nav.style.background = window.scrollY > 60
                ? 'rgba(5, 5, 8, 0.95)'
                : 'rgba(5, 5, 8, 0.6)';
        });
    </script>
</body>
</html>
